<section class="gallery-section section-padding section-bg" id="section_4">
  <div class="container">
  
      
       

      <gallery
        [items]="items"
        [loop]="true"
        [arrows]="true"
        [thumbs]="true"
        [counter]="true"
        [thumbsAutoScroll]="true"
        objectFit="contain"
        (itemClick)="openImage($event)"
      ></gallery>

      <div class="gallery-lightbox" *ngIf="selectedIndex >= 0" (click)="closeViewer()">
        <div class="gallery-lightbox__content" (click)="$event.stopPropagation()">
          <button type="button" class="gallery-lightbox__close" aria-label="Cerrar" (click)="closeViewer()">×</button>
          <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--prev" aria-label="Anterior" (click)="prevImage(); $event.stopPropagation()">‹</button>
          <img [src]="currentImage?.src" [alt]="currentImage?.alt || 'Imagen de galería'" />
          <button type="button" class="gallery-lightbox__nav gallery-lightbox__nav--next" aria-label="Siguiente" (click)="nextImage(); $event.stopPropagation()">›</button>
          <div class="gallery-lightbox__caption">
            {{ currentImage?.description || ('Imagen ' + (selectedIndex + 1) + ' de ' + items.length) }}
          </div>
        </div>
      </div>

   
  </div>
</section>
