<div class="blog">
    <div class="container">
        <div class="section-header text-center">

            <h2 class="section-title">Nuestras Tiendas</h2>
        </div>
        <owl-carousel-o [options]="blogCarouselOptions" class="blog-carousel" #blogCarousel>

            @for (slide of blogPosts(); track slide.tiendaId) {
            <ng-template carouselSlide [id]="slide.tiendaId+''">
                <div class="blog-item" (click)="openTienda(slide)">
                    <div class="blog-img">
                        <img (click)="openTienda(slide)" [src]="slide.imagen" [alt]="slide.nombre" [title]="slide.nombre" [width]="402"
                            [height]="251">
                    </div>
                </div>
                <div class="blog-meta">
                    <i class="fa fa-list-alt"></i>
                    <a (click)="openTienda(slide)">{{ slide.tag }}</a>
                    <i class="fa fa-calendar-alt"></i>
                    <p style="font-size: 0.85rem;color: #2b1c1c;margin-bottom: 10px;">{{ slide.horario1 }}</p>
                </div>
                <div class="blog-text">
                    <h2 style="font-size: 1.3rem;  font-weight: 700;  color: #333333;  margin: 10px 0;">{{ slide.nombre
                        }}</h2>
                    <p class="blog-description">{{ slide.descripcion }}</p>
                    <a class="btn" (click)="openTienda(slide)">
                        Más Información <i class="fa fa-angle-right"></i>
                    </a>
                </div>

            </ng-template>
            }

        </owl-carousel-o>
        <!-- Enlace a todas las tiendas -->
        <div class="text-center mt-4">
            <button type="button" class="btn custom-btn" (click)="goToDirectory()">
                Ver Todas las Tiendas <i class="fa fa-angle-right"></i>
            </button>
        </div>
        <div class="owl-nav">
            <button type="button" class="owl-prev" (click)="blogCarousel.prev()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="owl-next" (click)="blogCarousel.next()">
                <i class="fa fa-angle-right" aria-hidden="true"></i>
            </button>
        </div>
        
    </div>
</div>
