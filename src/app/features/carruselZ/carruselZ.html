<div class="blog">
    <div class="container">
        <div class="section-header text-center">

            <h2>Nuestras Tiendas</h2>
        </div>
        <owl-carousel-o [options]="blogCarouselOptions" class="blog-carousel" #blogCarousel>

            @for (slide of blogPosts(); track slide.id) {
            <ng-template carouselSlide [id]="slide.id">
                <div class="blog-item">
                    <div class="blog-img">
                        <img [src]="slide.image" [alt]="slide.title" [title]="slide.title">
                    </div>
                </div>
                <div class="blog-meta">
                    <i class="fa fa-list-alt"></i>
                    <a href="javascript:void(0)">{{ slide.tag }}</a>
                    <i class="fa fa-calendar-alt"></i>
                    <p>{{ slide.date }}</p>
                </div>
                <div class="blog-text">
                    <h2>{{ slide.title }}</h2>
                    <p>{{ slide.excerpt }}</p>
                    <a class="btn" [href]="slide.link || 'javascript:void(0)'">
                        Read More <i class="fa fa-angle-right"></i>
                    </a>
                </div>

            </ng-template>
            }

        </owl-carousel-o>
        <div class="owl-nav">
            <button type="button" class="owl-prev" (click)="blogCarousel.prev()">
                <i class="fa fa-angle-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="owl-next" (click)="blogCarousel.next()">
                <i class="fa fa-angle-right" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>
